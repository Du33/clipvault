<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4fa8ff"/>
      <stop offset="0.5" stop-color="#8fc8ff"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.14" r="0.6">
      <stop offset="0" stop-color="#fff4e6" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ffd5b5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd5b5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f3f8ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e4f8c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sun)"/>
  <rect x="64" y="64" width="896" height="448" rx="200" fill="url(#gloss)"/>
  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="292" y="240" width="440" height="560" rx="70" fill="url(#paper)"/>
    <rect x="402" y="196" width="220" height="104" rx="40" fill="#ffffff" stroke="#9cc8ff" stroke-width="10"/>
    <rect x="372" y="400" width="280" height="30" rx="15" fill="#5aa9ff"/>
    <rect x="372" y="480" width="230" height="30" rx="15" fill="#9cc8ff"/>
    <rect x="372" y="560" width="260" height="30" rx="15" fill="#ffb894"/>
    <rect x="372" y="640" width="170" height="30" rx="15" fill="#ffd2b8"/>
